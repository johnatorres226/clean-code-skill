[project]
name = "clean-code-standards"
version = "0.0.0"
description = "Maintainer environment for the clean-code-standards plugin"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff==0.17.*", "radon==6.*", "cognitive_complexity==1.*", "skillevaluator==0.9.*"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
extend-exclude = ["tools/evals/benchmarks"]  # upstream exercism tasks the evals run against

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "B", "UP", "C90", "PLR0913", "PLR0915", "PLR1702", "PLR2004", "FBT"]

[tool.ruff.lint.pylint]  # the CLAUDE.md code rules
max-args = 3
max-statements = 20
max-nested-blocks = 2

[tool.ruff.lint.per-file-ignores]  # existing findings; new files meet every rule (fix: #30)
"skills/setup-standards/templates/.githooks/standards.py" = ["FBT001", "PLR1702", "PLR2004"]
"tests/test_standards.py" = ["PLR0915", "PLR1702", "PLR2004"]
"tools/bench.py" = ["E731", "FBT001", "PLR0913", "PLR0915", "PLR1702", "PLR2004"]
"tools/evals/judge.py" = ["E501", "E731", "PLR0913"]  # E501: the judge prompt is one line
"tools/evals/lint.py" = ["B905", "C901", "FBT001", "PLR0915", "PLR1702", "PLR2004"]
"tools/regress.py" = ["PLR0913", "PLR0915"]
"tools/skill_audit.py" = ["B007", "PLR0913", "PLR1702", "PLR2004"]
"tools/skill_eval.py" = ["PLR0913", "PLR0915"]
