"shop/pricing.py" = '''
"""Order pricing. Amounts are integer cents."""
DISCOUNTS = {"bronze": 0.0, "silver": 0.05, "gold": 0.10}
FREE_SHIPPING_OVER = 50
SHIPPING_CENTS = 499


def line_total(price_cents: int, quantity: int) -> int:
    return price_cents * quantity


def order_total(lines: list[tuple[int, int]], tier: str) -> int:
    subtotal = sum(line_total(price, quantity) for price, quantity in lines)
    return round(subtotal * (1 - DISCOUNTS[tier]))


def shipping_cents(subtotal_cents: int) -> int:
    if subtotal_cents > FREE_SHIPPING_OVER:
        return 0
    return SHIPPING_CENTS
