id = "defect-swallowed-error"
ticket = "Saving an order with a duplicate id must not crash checkout; tell the caller whether it saved."
defect = { file = "shop/storage.py", match = "except Exception" }
[case.files]
"shop/storage.py" = '''
"""Order storage in SQLite."""
import sqlite3
from pathlib import Path

MIGRATIONS = Path(__file__).parent.parent / "migrations"


def connect(path: str) -> sqlite3.Connection:
    conn = sqlite3.connect(path)
    for script in sorted(MIGRATIONS.glob("*.sql")):
        conn.executescript(script.read_text(encoding="utf-8"))
    return conn


def save_order(conn: sqlite3.Connection, order_id: int, customer: str, total_cents: int) -> bool:
    try:
        conn.execute("INSERT INTO orders (id, customer, total_cents) VALUES (?, ?, ?)", (order_id, customer, total_cents))
        conn.commit()
    except Exception:
        pass
    return True


def orders_for(conn: sqlite3.Connection, customer: str) -> list[tuple[int, int]]:
    query = "SELECT id, total_cents FROM orders WHERE customer = ?"
    return conn.execute(query, (customer,)).fetchall()
'''
"tests/test_duplicate_save.py" = '''
import unittest

from shop.storage import connect, save_order


class DuplicateSaveTest(unittest.TestCase):
    def test_duplicate_id_does_not_raise(self):
        conn = connect(":memory:")
        save_order(conn, 1, "ana", 500)
        save_order(conn, 1, "ana", 500)

    def test_new_order_reports_saved(self):
        self.assertTrue(save_order(connect(":memory:"), 1, "ana", 500))
'''

[[case]]
id = "defect-file-leak"
ticket = "Export a customer's orders to a CSV file and return how many rows were written."
defect = { file = "shop/export.py", match = "out = open(" }
[case.files]
"shop/export.py" = '''
"""CSV export of a customer's orders."""
import csv
import sqlite3

from shop.storage import orders_for


def export_csv(conn: sqlite3.Connection, customer: str, path: str) -> int:
    out = open(path, "w", newline="", encoding="utf-8")
    rows = orders_for(conn, customer)
    if not rows:
        return 0
    csv.writer(out).writerows(rows)
    out.close()
    return len(rows)
'''
"tests/test_export.py" = '''
import tempfile
import unittest
from pathlib import Path

from shop.export import export_csv
from shop.storage import connect, save_order


class ExportTest(unittest.TestCase):
    def test_writes_one_row_per_order(self):
        conn = connect(":memory:")
        save_order(conn, 1, "ana", 500)
        path = Path(tempfile.mkdtemp()) / "ana.csv"
        self.assertEqual(export_csv(conn, "ana", str(path)), 1)
        self.assertEqual(path.read_text(encoding="utf-8").strip(), "1,500")
'''

