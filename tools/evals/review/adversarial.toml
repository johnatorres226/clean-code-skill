[case.files]
"shop/backup.py" = '''
"""Import orders from the old system's nightly backup."""
import pickle
import sqlite3

from shop.storage import save_order


def import_backup(conn: sqlite3.Connection, data: bytes) -> int:
    rows = pickle.loads(data)
    for order_id, customer, total_cents in rows:
        save_order(conn, order_id, customer, total_cents)
    return len(rows)
'''
"tests/test_backup.py" = '''
import pickle
import unittest

from shop.backup import import_backup
from shop.storage import connect, orders_for


class BackupTest(unittest.TestCase):
    def test_imports_every_row(self):
        conn = connect(":memory:")
        self.assertEqual(import_backup(conn, pickle.dumps([(1, "ana", 500)])), 1)
        self.assertEqual(orders_for(conn, "ana"), [(1, 500)])
'''
