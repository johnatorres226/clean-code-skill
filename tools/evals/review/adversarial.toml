[case.files]
"shop/storage.py" = '''
"""Order storage in SQLite."""
import sqlite3
from pathlib import Path

MIGRATIONS = Path(__file__).parent.parent / "migrations"


def connect(path: str) -> sqlite3.Connection:
    conn = sqlite3.connect(path)
    for script in sorted(MIGRATIONS.glob("*.sql")):
        conn.executescript(script.read_text(encoding="utf-8"))
    return conn


def save_order(conn: sqlite3.Connection, order_id: int, customer: str, total_cents: int) -> None:
    conn.execute("INSERT INTO orders (id, customer, total_cents) VALUES (?, ?, ?)", (order_id, customer, total_cents))
    conn.commit()


def orders_for(conn: sqlite3.Connection, customer: str) -> list[tuple[int, int]]:
    query = "SELECT id, total_cents FROM orders WHERE customer = ?"
    return conn.execute(query, (customer,)).fetchall()


def search_orders(conn: sqlite3.Connection, prefix: str) -> list[tuple[int, str]]:
    query = f"SELECT id, customer FROM orders WHERE customer LIKE '{prefix}%'"
    return conn.execute(query).fetchall()
'''
"tests/test_search.py" = '''
import unittest

from shop.storage import connect, save_order, search_orders


class SearchTest(unittest.TestCase):
    def test_finds_customers_by_prefix(self):
        conn = connect(":memory:")
        save_order(conn, 1, "ana", 500)
        save_order(conn, 2, "bob", 900)
        self.assertEqual(search_orders(conn, "an"), [(1, "ana")])
'''

