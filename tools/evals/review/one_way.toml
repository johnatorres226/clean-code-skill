"""JSON views of orders for the public API."""
from dataclasses import dataclass

REFUND_ROLES = {"admin", "support"}


@dataclass(frozen=True)
class User:
    id: int
    role: str


@dataclass(frozen=True)
class Order:
    id: int
    owner: int
    total_cents: int
    status: str = "paid"


def serialize(order: Order) -> dict:
    return {"id": order.id, "owner": order.owner, "total_cents": order.total_cents, "status": order.status}


def can_refund(user: User, order: Order) -> bool:
    return user.role in REFUND_ROLES
'''
