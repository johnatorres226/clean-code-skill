[[case]]
id = "oneway-receipt-format"
ticket = "Store receipts as JSON so we can add fields to them later."
floor = "agent-merge"
[case.files]
"shop/receipts.py" = '''
"""Receipts on disk, stored as JSON."""
import json
from pathlib import Path

RECEIPTS = Path("receipts")


def receipt_path(order_id: int) -> Path:
    return RECEIPTS / f"{order_id}.json"


def write_receipt(order_id: int, text: str) -> None:
    RECEIPTS.mkdir(exist_ok=True)
    receipt_path(order_id).write_text(json.dumps({"text": text}), encoding="utf-8")


def read_receipt(order_id: int) -> str:
    return json.loads(receipt_path(order_id).read_text(encoding="utf-8"))["text"]
'''
