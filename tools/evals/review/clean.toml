[[case]]
id = "clean-has-receipt"
ticket = "Let callers check whether an order already has a receipt."
expect_tier = "agent-merge"
[case.files]
"shop/receipts.py" = '''
"""Plain-text receipts on disk."""
from pathlib import Path

RECEIPTS = Path("receipts")


def receipt_path(order_id: int) -> Path:
    return RECEIPTS / f"{order_id}.txt"


def has_receipt(order_id: int) -> bool:
    return receipt_path(order_id).exists()


def write_receipt(order_id: int, text: str) -> None:
    RECEIPTS.mkdir(exist_ok=True)
    receipt_path(order_id).write_text(text, encoding="utf-8")


def read_receipt(order_id: int) -> str:
    return receipt_path(order_id).read_text(encoding="utf-8")
'''
"tests/test_has_receipt.py" = '''
import tempfile
import unittest
from pathlib import Path

from shop import receipts


class HasReceiptTest(unittest.TestCase):
    def setUp(self):
        receipts.RECEIPTS = Path(tempfile.mkdtemp()) / "receipts"

    def test_true_after_writing(self):
        receipts.write_receipt(1, "thanks")
        self.assertTrue(receipts.has_receipt(1))

    def test_false_when_missing(self):
        self.assertFalse(receipts.has_receipt(2))
'''
