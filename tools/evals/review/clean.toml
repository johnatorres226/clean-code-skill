[[case]]
id = "clean-newest-first"
ticket = "List a customer's orders newest first."
expect_tier = "agent-merge"
[case.files]
"shop/storage.py" = '''
"""Order storage in SQLite."""
import sqlite3
from pathlib import Path

MIGRATIONS = Path(__file__).parent.parent / "migrations"


def connect(path: str) -> sqlite3.Connection:
    conn = sqlite3.connect(path)
    for script in sorted(MIGRATIONS.glob("*.sql")):
        conn.executescript(script.read_text(encoding="utf-8"))
    return conn


def save_order(conn: sqlite3.Connection, order_id: int, customer: str, total_cents: int) -> None:
    conn.execute("INSERT INTO orders (id, customer, total_cents) VALUES (?, ?, ?)", (order_id, customer, total_cents))
    conn.commit()


def orders_for(conn: sqlite3.Connection, customer: str) -> list[tuple[int, int]]:
    query = "SELECT id, total_cents FROM orders WHERE customer = ? ORDER BY id DESC"
    return conn.execute(query, (customer,)).fetchall()
'''
"tests/test_newest_first.py" = '''
import unittest

from shop.storage import connect, orders_for, save_order


class NewestFirstTest(unittest.TestCase):
    def test_orders_are_listed_newest_first(self):
        conn = connect(":memory:")
        save_order(conn, 1, "ana", 500)
        save_order(conn, 2, "ana", 700)
        self.assertEqual(orders_for(conn, "ana"), [(2, 700), (1, 500)])
'''

