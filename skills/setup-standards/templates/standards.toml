# Single source of truth for this repo's standards. Read by .githooks/standards.py (hooks + CI)
# and by the clean-code-standards skills. Edit values, not the scripts.

[branches]
protected   = ["main", "dev"]          # never committed or pushed to directly
integration = "dev"                    # feature branches start here and PR back here
release     = "main"                   # only `integration` merges here
prefixes    = ["feat/", "fix/", "refactor/", "perf/", "test/", "docs/", "chore/", "ci/", "build/"]
merge       = "rebase"                 # feature -> dev keeps atomic commits; dev -> main: "merge"

[commits]                              # Conventional Commits, one concern each
types             = ["feat", "fix", "refactor", "perf", "test", "docs", "chore", "ci", "build", "revert"]
max_subject       = 72
max_added_lines   = 300
max_files         = 10

[pr]
max_added_lines   = 400                # review quality drops sharply past ~400 lines
max_files         = 25
reviews_required  = 1

[roles]                                # seniority = what you own, not your GitHub role
senior       = ["@org/seniors"]        # own `guarded`, approve releases; associates own nothing
guarded      = ["standards.toml", ".githooks/", ".github/", ".claude/"]  # the enforcement surface
admin_bypass = false                   # true only on a solo repo: admin merges own PRs (PR-only, logged)

[roles.areas]                          # mid tier: path -> owning team (seniors co-own every area)
"src/billing/" = ["@org/billing"]

[size]                                 # deletions never count; `size-exempt` skips size checks when
                                       # a reviewer (not the PR author) applies it
exclude = ["*.lock", "*-lock.json", "*.min.*", "*.snap", "vendor/*", "dist/*"]

[gates]                                # shell commands, run in this order; "" = not applicable
format    = ""                         # check-only, never rewrites (e.g. ruff format --check .)
lint      = ""
typecheck = ""
test      = ""
