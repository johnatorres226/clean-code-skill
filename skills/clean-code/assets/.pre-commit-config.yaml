# Formatting and mechanical style, enforced automatically so review can be about design.
# Install:  pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml

  # ---- Python ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies: []

  # ---- C / C++ ----
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # ---- Local: the clean-code linter that ships with this skill ----
  - repo: local
    hooks:
      - id: clean-code-lint
        name: clean code smells
        entry: python3 scripts/clean_code_lint.py
        language: system
        pass_filenames: true
        types_or: [c, c++, java, python]
        args: [--min-severity, high, --fail-on-findings]
