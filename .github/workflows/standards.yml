name: standards
on:
  pull_request:
  push:
    branches: [main, dev]
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Commits and PR size
        if: github.event_name == 'pull_request'
        run: python3 skills/setup-standards/templates/.githooks/standards.py range origin/${{ github.base_ref }} ${{ contains(github.event.pull_request.labels.*.name, 'size-exempt') && '--no-size' || '' }}
      - name: Gates
        run: python3 skills/setup-standards/templates/.githooks/standards.py check
