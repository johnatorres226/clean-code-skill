name: standards
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, dev]
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use the base branch's rules (a PR cannot loosen its own checks)
        if: github.event_name == 'pull_request'
        run: git checkout origin/${{ github.base_ref }} -- standards.toml skills/setup-standards/templates/.githooks/standards.py || echo "no rules on base yet"
      - name: Size exemption counts only when someone other than the author applied it
        id: exempt
        if: contains(github.event.pull_request.labels.*.name, 'size-exempt')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          by=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/events" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "size-exempt")] | last | .actor.login' | grep -vx null | tail -1)  # --jq runs per page
          if [ -n "$by" ] && [ "$by" != "${{ github.event.pull_request.user.login }}" ]; then echo "flag=--no-size" >> "$GITHUB_OUTPUT"
          else echo "::warning::size-exempt was applied by the PR author, so it is ignored"; fi
      - name: Commits, PR size, branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}  # via env, never inline: branch names and bodies are untrusted
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md" && python3 skills/setup-standards/templates/.githooks/standards.py range origin/${{ github.base_ref }} --branch "$HEAD_REF" --body-file "$RUNNER_TEMP/pr-body.md" ${{ steps.exempt.outputs.flag }}
      - name: Gates
        run: python3 skills/setup-standards/templates/.githooks/standards.py check
      - name: Skill regression gate (token cost, SkillEvaluator quality, self-checks)
        run: |
          pip install --quiet skillevaluator
          python tests/test_regress.py
          python tools/regress.py static
