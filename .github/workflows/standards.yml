name: standards
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  pull_request_review:                 # re-runs `tier` when a senior approves or an approval is dismissed
    types: [submitted, edited, dismissed]
  push:
    branches: [main, dev]
permissions:
  contents: read
  pull-requests: read                  # reviews, for the tier gate
  issues: read                         # label events, for size-exempt
  checks: read                         # ticket PRs' checks, for release proof of review
jobs:
  standards:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rules from the base branch, code from the PR (a PR cannot loosen its own checks)
        env:                           # the PR's standards.py stays in the tree, so its own tests test it
          BASE: ${{ github.base_ref }}  # empty on push
        run: |
          cp skills/setup-standards/templates/.githooks/standards.py "$RUNNER_TEMP/standards.py"
          if [ -n "$BASE" ]; then
            git show "origin/$BASE:skills/setup-standards/templates/.githooks/standards.py" > "$RUNNER_TEMP/base.py" && mv "$RUNNER_TEMP/base.py" "$RUNNER_TEMP/standards.py" && git checkout "origin/$BASE" -- standards.toml || echo "no rules on base yet"
          fi
      - name: Size exemption counts only when someone other than the author applied it
        id: exempt
        if: contains(github.event.pull_request.labels.*.name, 'size-exempt')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          by=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/events" --paginate \
            --jq '[.[] | select(.event == "labeled" and .label.name == "size-exempt")] | last | .actor.login' | grep -vx null | tail -1)  # --jq runs per page
          if [ -n "$by" ] && [ "$by" != "${{ github.event.pull_request.user.login }}" ]; then echo "flag=--no-size" >> "$GITHUB_OUTPUT"
          else echo "::warning::size-exempt was applied by the PR author, so it is ignored"; fi
      - name: Commits, PR size, branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}  # via env, never inline: branch names and bodies are untrusted
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md" && python3 "$RUNNER_TEMP/standards.py" range origin/${{ github.base_ref }} --branch "$HEAD_REF" --body-file "$RUNNER_TEMP/pr-body.md" ${{ steps.exempt.outputs.flag }}
      - name: Gates
        run: python3 "$RUNNER_TEMP/standards.py" check
      - name: Skill regression gate (token cost, SkillEvaluator quality, self-checks)
        run: |
          pip install --quiet skillevaluator
          python tests/test_regress.py
          python tools/regress.py static
      - name: Release - proof of review and release gates (docs/adr/0003)
        if: github.event_name == 'pull_request' && github.head_ref == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/standards.py" release origin/${{ github.base_ref }}
  tier:                                # required check: human review waits for a senior (docs/adr/0002)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tier floor; human review needs a senior's approval of the head commit
        env:
          GH_TOKEN: ${{ github.token }}  # team seniors: a token that can read the org's teams
          BASE_REF: ${{ github.event.pull_request.base.ref }}  # base_ref is empty on review events
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout "origin/$BASE_REF" -- standards.toml skills/setup-standards/templates/.githooks/standards.py || echo "no rules on base yet"
          python3 skills/setup-standards/templates/.githooks/standards.py tier "origin/$BASE_REF" --pr ${{ github.event.pull_request.number }} --branch "$HEAD_REF"
